apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: observability
  labels: { app: payments-api }
spec:
  selector: { app: payments-api }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: observability
spec:
  replicas: 3
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels:
        app: payments-api
        # Picked up by add_kubernetes_metadata and mapped onto service.name in
        # the Logstash parse stage, which is how events from three replicas end
        # up aggregated as one service on the dashboards.
        service: payments-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payments-api
          image: sentinel/payments-api:1.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SERVICE_NAME,    value: "payments-api" }
            - { name: SERVICE_VERSION, value: "1.4.2" }
            - { name: SERVICE_ENV,     value: "production" }
            - { name: LOG_LEVEL,       value: "INFO" }
            - { name: SIMULATED_ERROR_RATE, value: "0.04" }
            - { name: SIMULATED_SLOW_RATE,  value: "0.06" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # readOnlyRootFilesystem means gunicorn cannot write its temporary
            # worker heartbeat files without this.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: "/readyz", port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: "/healthz", port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
# Without this the namespace-wide default-deny blocks all traffic to the app,
# including the load generator, and the whole demo produces no logs at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-api-policy
  namespace: observability
spec:
  podSelector:
    matchLabels: { app: payments-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
          # Any pod in this namespace - the load generator and an nginx front
          # end both live here. Deliberately not open to other namespaces.
      ports:
        - { port: 8080, protocol: TCP }
  egress: []
  # No egress at all. The app talks to nothing outbound; its logs leave via
  # stdout, which the node-local agent reads off the filesystem. That is worth
  # noting as a property of this architecture: the application never needs
  # network access to the logging platform, so it cannot be used to reach it.
