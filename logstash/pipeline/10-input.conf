# ---------------------------------------------------------------------------
# Inputs
#
# Logstash concatenates every *.conf in this directory in alphabetical order
# into a single pipeline, hence the numeric prefixes. Splitting by stage keeps
# each file reviewable; it is one pipeline at runtime.
# ---------------------------------------------------------------------------

input {
  # Elastic Agent / Filebeat ship here over the Beats protocol. This is the
  # production path - the agent handles container log discovery, offset
  # tracking across restarts, and backpressure.
  beats {
    port => 5044
    client_inactivity_timeout => 300
    # Beats reconnect aggressively; without this the default 60s timeout
    # produces a steady drip of "connection reset" noise in the Logstash log
    # that masks real transport problems.
  }

  # Direct TCP for local development and for replaying a captured log file
  # with `nc`. Not exposed in the Kubernetes manifests.
  tcp {
    port  => 5000
    codec => json_lines
    tags  => ["source:tcp-dev"]
  }

  # Self-monitoring: Logstash's own heartbeat proves the pipeline is alive even
  # when no application traffic is flowing. Without it, "no data" and "pipeline
  # dead" look identical on a dashboard, which is the worst possible ambiguity
  # during an incident.
  heartbeat {
    interval => 30
    type     => "heartbeat"
    message  => "ok"
  }
}
