# Placeholder so `kustomize build` resolves the resource list even before the
# generators run. The real ConfigMaps (logstash-pipeline, logstash-config) are
# produced by configMapGenerator in ../kustomization.yaml from the files in
# ../../logstash/, which keeps the Compose stack and the cluster on identical
# pipeline definitions.
#
# This object holds only the non-generated bits.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-runtime-notes
  namespace: observability
data:
  README: |
    Pipeline and config ConfigMaps are generated by kustomize.
    Edit logstash/pipeline/*.conf at the repository root, then:
        kubectl apply -k k8s/
    The content hash changes the ConfigMap name, which rolls the Deployment.
