# nginx sits in front of payments-api for one reason that matters to this
# project: it produces a classic combined access log. That gives the pipeline a
# free-text source to grok, alongside the app's structured JSON, so both parse
# paths in 20-parse.conf are exercised by the real stack rather than by tests.

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Combined format plus two additions:
    #   rt=  upstream response time, so latency is available without the app
    #   rid= the request id, which is what joins an access log line to the
    #        application log lines emitted while serving that same request
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$upstream_response_time rid=$request_id';

    # stdout, not a file. The container runtime captures stdout and the
    # collector reads it from there; writing to a file inside a container means
    # owning rotation and losing the logs when the pod is replaced.
    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout  65;

    upstream payments_api {
        server payments-api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Pass the request id downstream so the app can log the same value.
        proxy_set_header X-Request-Id     $request_id;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header Host             $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Health checks are excluded from the access log. At one probe every
        # 10s across replicas they would otherwise be the single largest
        # contributor to log volume and would tell you nothing.
        location = /healthz {
            access_log off;
            proxy_pass http://payments_api;
        }

        location / {
            proxy_pass http://payments_api;
        }
    }
}
