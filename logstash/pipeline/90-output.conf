# ---------------------------------------------------------------------------
# Output - route to data streams
#
# Routing is by [event][dataset] into separate data streams rather than one
# fat index. That buys three things: per-dataset retention (security events
# kept 90d, access logs 14d), per-dataset mappings, and the ability to drop a
# noisy dataset without touching anything else.
# ---------------------------------------------------------------------------

output {

  if [type] == "heartbeat" {
    elasticsearch {
      hosts    => ["${ELASTICSEARCH_HOSTS:https://elasticsearch:9200}"]
      user     => "${ELASTIC_USER:elastic}"
      password => "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
      data_stream           => "true"
      data_stream_type      => "metrics"
      data_stream_dataset   => "logstash.heartbeat"
      data_stream_namespace => "default"
    }
  }

  # Events that matched no parser go to their own stream so they are visible
  # and countable. A rising count here means a log format changed upstream.
  else if "parsed:none" in [tags] or "_grokparsefailure_nginx" in [tags] {
    elasticsearch {
      hosts    => ["${ELASTICSEARCH_HOSTS:https://elasticsearch:9200}"]
      user     => "${ELASTIC_USER:elastic}"
      password => "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
      data_stream           => "true"
      data_stream_type      => "logs"
      data_stream_dataset   => "platform.unparsed"
      data_stream_namespace => "default"
    }
  }

  else {
    elasticsearch {
      hosts    => ["${ELASTICSEARCH_HOSTS:https://elasticsearch:9200}"]
      user     => "${ELASTIC_USER:elastic}"
      password => "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]

      # Stream name comes from [data_stream][*] set in 80-route.conf
      # (auto-routing); interpolating here is not supported by the plugin.
      data_stream           => "true"

      # Content-derived id makes retries and agent replays idempotent.
      document_id => "%{[@metadata][fingerprint]}"

      # "create" fails with 409 if the id already exists - that is the dedup
      # working, not a failure. (retry_on_conflict is not allowed with
      # data_stream, and it only applies to updates anyway.)
      action            => "create"

      # Bulk size comes from pipeline.batch.size in logstash.yml (250). Larger
      # batches are more efficient but a failed bulk request costs more to retry.
      manage_template => false
    }
  }

  # --- Dead letter visibility ------------------------------------------------
  # Anything Elasticsearch rejects outright (mapping conflict, malformed doc)
  # lands in the DLQ configured in logstash.yml. Printing rejected events to
  # stdout as well means `kubectl logs` shows them during development instead
  # of them vanishing into a queue nobody checks.
  if "_elasticsearch_output_failure" in [tags] {
    stdout { codec => rubydebug { metadata => true } }
  }
}
