# ---------------------------------------------------------------------------
# Parse - turn bytes into fields
#
# Two shapes arrive here:
#   1. ECS JSON from payments-api    -> already structured, just unwrap
#   2. nginx combined access log     -> free text, needs grok
# ---------------------------------------------------------------------------

filter {

  # The heartbeat never needs parsing or enrichment. Logstash's config DSL has
  # no early return, so the whole parse stage hangs off this one else-branch.
  if [type] == "heartbeat" {
    mutate { add_field => { "[event][dataset]" => "logstash.heartbeat" } }
  } else {

  # --- Container metadata ---------------------------------------------------
  # The agent attaches Kubernetes metadata under [kubernetes]. Lift the parts
  # we actually query onto ECS fields so a dashboard filter is the same
  # regardless of whether an event came from Kubernetes or a bare container.
  if [kubernetes] {
    mutate {
      rename => {
        "[kubernetes][pod][name]"       => "[orchestrator][resource][name]"
        "[kubernetes][namespace]"       => "[orchestrator][namespace]"
        "[kubernetes][node][name]"      => "[orchestrator][resource][parent][name]"
        "[kubernetes][labels][app]"     => "[service][name]"
      }
      add_field => { "[orchestrator][type]" => "kubernetes" }
    }
  }

  # --- Path 1: application JSON --------------------------------------------
  # The agent delivers the container's stdout line in [message]. If it starts
  # with '{' it is our ECS JSON and we parse it into the root of the event.
  if [message] =~ /^\s*\{/ {
    json {
      source        => "message"
      target        => "app"
      skip_on_invalid_json => true
      # Parsing into a sub-field first, then promoting, means a malformed line
      # cannot clobber top-level fields the agent already set (host, agent...).
    }

    if [app] {
      ruby {
        # Promote the parsed ECS document to the event root, but never let it
        # overwrite fields the collector set - collector metadata is more
        # trustworthy than anything the application claims about itself.
        code => '
          app = event.get("app")
          if app.is_a?(Hash)
            # The collector knows more about where an event came from than the
            # event does. Never let application-supplied JSON overwrite these.
            protected_keys = ["agent", "host", "input", "@version", "tags"]

            # @timestamp must not be promoted as a raw string - Logstash
            # expects a Timestamp object at the root. Stash it for the date
            # filter in 30-normalize.conf to parse properly.
            if app["@timestamp"]
              event.set("[@metadata][app_timestamp]", app["@timestamp"])
            end

            app.each do |k, v|
              next if protected_keys.include?(k) || k == "@timestamp"
              existing = event.get(k)
              if existing.is_a?(Hash) && v.is_a?(Hash)
                event.set(k, existing.merge(v))
              else
                event.set(k, v)
              end
            end
            event.remove("app")
          end
        '
      }
      mutate { add_tag => ["parsed:app-json"] }
    }
  }

  # --- Path 2: nginx combined access log ------------------------------------
  else if [message] =~ /^\S+ \S+ \S+ \[/ {
    grok {
      match => {
        "message" => [
          # Combined log format plus the two extras our nginx config appends:
          # upstream response time and the request id used for correlation.
          '%{IPORHOST:[source][ip]} %{USER:[user][id]} %{USER:[user][name]} \[%{HTTPDATE:[event][created]}\] "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status_code]:int} (?:-|%{INT:[http][response][body][bytes]:int}) "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}" rt=%{NUMBER:[event][duration_sec]:float} rid=%{NOTSPACE:[trace][id]}',
          # Fallback: plain combined, for anything that predates the extras.
          '%{COMBINEDAPACHELOG}'
        ]
      }
      tag_on_failure => ["_grokparsefailure_nginx"]
      # Cap the regex engine so a pathological line cannot stall the worker.
      timeout_millis => 500
    }

    if "_grokparsefailure_nginx" not in [tags] {
      date {
        match  => ["[event][created]", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
      }
      # Logstash duration is nanoseconds in ECS; nginx reports seconds.
      if [event][duration_sec] {
        ruby {
          code => 'event.set("[event][duration]", (event.get("[event][duration_sec]").to_f * 1_000_000_000).to_i)'
        }
        mutate { remove_field => ["[event][duration_sec]"] }
      }
      mutate {
        add_field => {
          "[event][kind]"     => "event"
          "[event][category]" => "web"
          "[event][dataset]"  => "nginx.access"
          "[event][module]"   => "nginx"
        }
        add_tag => ["parsed:nginx"]
      }
    }
  }

  # Anything that matched neither shape is kept, tagged, and routed to a
  # separate index. Silently dropping unparsed logs is how you discover six
  # months later that a whole service was never being collected.
  else {
    mutate { add_tag => ["parsed:none"] }
  }

  } # end heartbeat else-branch
}
