# ---------------------------------------------------------------------------
# Route - decide the data stream each event is written to
#
# The elasticsearch output in data_stream mode does NOT interpolate
# %{[event][dataset]} inside data_stream_dataset - it uses the string
# literally and every event is rejected ("Badly formatted index ... still
# contains placeholder"). The supported mechanism is auto-routing: the plugin
# reads [data_stream][type|dataset|namespace] from the event itself.
#
# Heartbeats and unparsed events keep their fixed streams (set in 90-output).
# ---------------------------------------------------------------------------

filter {
  if [event][dataset]
     and [type] != "heartbeat"
     and "parsed:none" not in [tags]
     and "_grokparsefailure_nginx" not in [tags] {
    mutate {
      add_field => {
        "[data_stream][type]"      => "logs"
        "[data_stream][dataset]"   => "%{[event][dataset]}"
        "[data_stream][namespace]" => "${ES_NAMESPACE:default}"
      }
    }
  }
}
