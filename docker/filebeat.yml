# Filebeat - the collector for the Docker Compose stack.
#
# The Kubernetes deployment uses Elastic Agent instead (k8s/agent/), which is
# the supported path there. Filebeat is used here because it configures in one
# file and does not need a Fleet server to exist first.

filebeat.autodiscover:
  providers:
    - type: docker
      # Hint-based: a container is collected only if it carries the label
      # co.elastic.logs/enabled: "true" (keeps Elasticsearch's own logs out,
      # which would otherwise create a feedback loop). Hints are used instead of
      # a `contains` condition on docker.container.labels.* because that
      # condition never matched here and failed silently.
      hints.enabled: true
      hints.default_config:
        enabled: false          # opt-in only; the label above turns it on
        type: container
        paths:
          - /var/lib/docker/containers/${data.container.id}/*.log
        # One Python traceback = one event, not 15 documents.
        multiline:
          type: pattern
          pattern: '^[[:space:]]+(at|\.{3})[[:space:]]|^Caused by:|^Traceback|^[[:space:]]+File "'
          negate: false
          match: after
          max_lines: 100
          timeout: 5s

processors:
  # Attach container name, image and labels to every event.
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

  # Drop Filebeat's own agent bookkeeping fields that nothing queries. They are
  # small individually and meaningful at a hundred million events a day.
  - drop_fields:
      fields: ["agent.ephemeral_id", "agent.id", "ecs.version", "input.type"]
      ignore_missing: true

output.logstash:
  hosts: ["logstash:5044"]

  # Load balance across Logstash instances when there is more than one. In
  # Compose there is one; in Kubernetes the Service resolves to several.
  loadbalance: true

  # Backpressure: if Logstash is slow, Filebeat slows down reading rather than
  # buffering without bound. The container log files on disk become the buffer,
  # which is exactly what they are good for.
  bulk_max_size: 512
  ttl: 30s

# Filebeat's own logs, so a collector failure is visible.
logging.level: info
logging.to_stderr: true

# Registry - where read offsets are stored. Mounted on a volume so a restart
# resumes where it left off instead of re-reading every file from the start.
filebeat.registry.path: /usr/share/filebeat/data/registry
