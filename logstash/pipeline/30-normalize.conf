# ---------------------------------------------------------------------------
# Normalize - make fields mean the same thing regardless of source
#
# This stage is what makes "search across everything" actually work. Parsing
# alone gives you nginx's status code in one field and the app's in another;
# normalizing is what lets one dashboard panel chart both.
# ---------------------------------------------------------------------------

filter {

  if [type] != "heartbeat" {

    # --- Canonical timestamp ------------------------------------------------
    # Prefer the timestamp the application recorded over the time Logstash
    # happened to receive the event. Under backpressure those can differ by
    # minutes, and an incident timeline built on receipt time is wrong.
    if [@metadata][app_timestamp] {
      date {
        match  => ["[@metadata][app_timestamp]", "ISO8601"]
        target => "@timestamp"
        tag_on_failure => ["_dateparsefailure_app"]
      }
    }

    # Ingest lag, in seconds. Charting this is the cheapest early warning that
    # the pipeline is falling behind - it climbs long before anything drops.
    ruby {
      code => 'event.set("[event][ingested_lag_sec]", (Time.now.to_f - event.get("@timestamp").to_f).round(3))'
    }

    # --- HTTP status classification -----------------------------------------
    # A single keyword field is far cheaper to aggregate on than a range query
    # over an integer, and it survives someone charting "errors" without
    # knowing the 4xx/5xx split.
    if [http][response][status_code] {
      if [http][response][status_code] >= 500 {
        mutate { add_field => { "[http][response][status_class]" => "5xx"
                                "[event][outcome]"               => "failure" } }
      } else if [http][response][status_code] >= 400 {
        mutate { add_field => { "[http][response][status_class]" => "4xx"
                                "[event][outcome]"               => "failure" } }
      } else if [http][response][status_code] >= 300 {
        mutate { add_field => { "[http][response][status_class]" => "3xx"
                                "[event][outcome]"               => "success" } }
      } else {
        mutate { add_field => { "[http][response][status_class]" => "2xx"
                                "[event][outcome]"               => "success" } }
      }
    }

    # --- URL decomposition ---------------------------------------------------
    # Split the query string off the path. Without this, every distinct
    # ?id=<n> is its own bucket and a "top endpoints" panel is meaningless.
    if [url][original] and ![url][path] {
      grok {
        match => { "[url][original]" => "^%{URIPATH:[url][path]}(?:\?%{GREEDYDATA:[url][query]})?$" }
        tag_on_failure => ["_urlparsefailure"]
        timeout_millis => 200
      }
    }

    # Normalize the log level vocabulary. Different libraries emit WARNING,
    # warn, W and 30 for the same thing; detections should not have to know.
    if [log][level] {
      mutate { lowercase => ["[log][level]"] }
      translate {
        source      => "[log][level]"
        target      => "[log][level]"
        dictionary  => {
          "warning"  => "warn"
          "err"      => "error"
          "critical" => "fatal"
          "crit"     => "fatal"
          "panic"    => "fatal"
        }
        fallback    => "%{[log][level]}"
        override    => true
      }
    }

    # --- Severity score ------------------------------------------------------
    # A numeric 0-100 severity lets one "top alerts" panel rank events that
    # came from completely different detections.
    if ![event][severity] {
      if [log][level] == "fatal"      { mutate { add_field => { "[event][severity]" => "90" } } }
      else if [log][level] == "error" { mutate { add_field => { "[event][severity]" => "70" } } }
      else if [log][level] == "warn"  { mutate { add_field => { "[event][severity]" => "40" } } }
      else                            { mutate { add_field => { "[event][severity]" => "10" } } }
    }
    mutate { convert => { "[event][severity]" => "integer" } }

    # --- Deduplication key ---------------------------------------------------
    # A stable document _id derived from content makes the whole pipeline
    # idempotent: if the agent replays a file after a crash, or Logstash
    # retries a bulk request that actually succeeded, the duplicate overwrites
    # itself instead of double-counting every dashboard.
    fingerprint {
      source        => ["@timestamp", "message", "[host][hostname]", "[service][name]"]
      target        => "[@metadata][fingerprint]"
      method        => "SHA256"
      concatenate_sources => true
    }
  }
}
